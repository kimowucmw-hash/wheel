<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃30社博攤位遊戲</title>
    <style>
        :root {
            --primary-bg: #fff0f5;
            --text-color: #555;
            --btn-color: #ffb3ba;
            --btn-hover: #ff9bad;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .view {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .view.active {
            display: block;
            /* 遊戲規則樣式 */
        .rules-container {
            display: inline-block;
            text-align: left;
            color: #000;
            font-weight: 900;
            /* 這裡的 margin-bottom 控制了轉盤下移的幅度，若覺得太遠或太近，修改這個數值(例如改成 30px 或 50px) */
            margin-bottom: 40px; 
            font-family: 'Arial Black', 'LiHei Pro', sans-serif;
        }
        .rules-title {
            font-size: 32px;
            text-align: right;
            margin-bottom: 15px;
            padding-right: 10px;
        }
        .rules-list {
            font-size: 24px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 轉盤樣式 */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
        }
        .wheel-labels {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
        }
        .wheel-label {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            padding-top: 15px;
            box-sizing: border-box;
            font-weight: bold;
            font-size: 16px;
            color: #333;
            transform-origin: 50% 50%;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff6b6b;
            z-index: 10;
        }
        .btn {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin: 5px;
        }
        .btn:hover { background-color: var(--btn-hover); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* 題目樣式 */
        .question-title {
            font-size: 32px; /* 從 24px 放大 */
            margin-bottom: 25px;
            font-weight: bold;
            line-height: 1.5;
        }
        .question-img {
            max-width: 100%;
            max-height: 300px; /* 圖片最大高度稍微放寬 */
            border-radius: 10px;
            margin-bottom: 25px;
            display: none;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* 選項之間的間距加大 */
        }
        .option-btn {
            background-color: white;
            border: 3px solid var(--btn-color); /* 邊框加粗 */
            color: var(--text-color);
            padding: 20px; /* 內距加大，讓按鈕變厚 */
            border-radius: 12px;
            font-size: 24px; /* 從 16px 放大 */
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            font-weight: bold;
        }
        .option-btn:hover { background-color: var(--btn-color); color: white; }
        
        /* 針對題目編號的特別設定 */
        #q-number {
            font-size: 28px;
            color: var(--btn-hover);
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* 回饋樣式 */
        .feedback-icon { 
            font-size: 120px; /* 從 80px 放大 */
            margin-bottom: 15px; 
        }
        .correct { color: #4ecdc4; }
        .incorrect { color: #ff6b6b; }
        
        #r-title {
            font-size: 42px; /* 答對/答錯的標題放大 */
            margin: 15px 0;
        }
        #r-desc {
            font-size: 26px; /* 說明文字放大 */
            line-height: 1.5;
            margin-bottom: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 視圖 1: 轉盤 -->
    <div id="view-wheel" class="view active">
        
        <!-- 新增的規則區塊 -->
        <div class="rules-container">
            <div class="rules-title">遊戲規則:</div>
            <div class="rules-list">
                1. 旋轉轉盤2次<br>
                2. 回答轉盤轉到的2個問題<br>
                3. 追蹤桃友會🍑IG<br>
                4. 獲得小禮物🎁🎉
            </div>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div id="wheel" class="wheel">
                <div id="wheel-labels" class="wheel-labels"></div>
            </div>
        </div>
        <button id="spin-btn" class="btn" onclick="spinWheel()">旋轉轉盤</button>
    </div>

    <div id="view-question" class="view">
        <!-- 移除了原本 inline 的 style，交給 css 控制 -->
        <h2 id="q-number"></h2>
        <div id="q-title" class="question-title"></div>
        <img id="q-img" class="question-img" src="" alt="題目圖片">
        <div id="q-options" class="options-container"></div>
    </div>

    <!-- 視圖 3: 結果 -->
    <div id="view-result" class="view">
        <div id="r-icon" class="feedback-icon"></div>
        <h2 id="r-title"></h2>
        <!-- 移除了原本 inline 的 font-size: 18px -->
        <p id="r-desc"></p>
        <!-- 下方的按鈕也加上一點 inline style 讓它跟著變大 -->
        <button class="btn" style="font-size: 24px; padding: 15px 40px;" onclick="goToWheel()">回到轉盤</button>
    </div>
</div>

<script>
    // 建立 20 題的題庫資料庫
    const questions = [
        { id: 1, title: "桃園沒有什麼台鐵車站?", options: ["(A) 觀音", "(B) 中壢", "(C) 桃園"], ans: 0 },
        { id: 2, title: "桃園沒有以下哪一區?", options: ["(A) 桃源", "(B) 復興", "(C) 蘆竹"], ans: 0 },
        { id: 3, title: "這裡是哪裡?", img: "map.png", options: ["(A) 中壢區", "(B) 桃園區"], ans: 1 },
        { id: 4, title: "桃園高鐵站在?", options: ["(A) 中壢區", "(B) 桃園區"], ans: 0 },
        { id: 5, title: "中壢國中在?", options: ["(A) 中壢區", "(B) 平鎮區"], ans: 1 },
        { id: 6, title: "林口長庚醫院在哪裡?", options: ["(A) 桃園市龜山區", "(B) 新北市林口區"], ans: 0 },
        { id: 7, title: "目前機場捷運最南站是哪一站?", options: ["(A) A23 中壢車站", "(B) A22 老街溪", "(C) A23 老街溪"], ans: 1 },
        { id: 8, title: "師大桃友會的全名是?", options: ["(A) 國立臺灣師範大學桃園好朋友會", "(B) 國立臺灣師範大學桃園同鄉校友會", "(C) 國立臺灣吃飯大學只有桃園人能參加的好朋友秘密會"], ans: 1 },
        { id: 9, title: "臺灣最北的機場是哪個?", options: ["(A) 臺北松山機場", "(B) 桃園國際機場"], ans: 1 },
        { id: 10, title: "下列何者是桃園生產最多的牲畜?", options: ["(A) 黑豬", "(B) 烏骨雞", "(C) 可達鴨"], ans: 0 },
        { id: 11, title: "桃園是臺灣最多XX廟的地方?", options: ["(A) 媽祖廟", "(B) 土地公廟", "(C) 關公廟"], ans: 1 },
        { id: 12, title: "桃園是臺灣最多XX的地方?", options: ["(A) 埤塘", "(B) 池塘", "(C) 湖"], ans: 0 },
        { id: 13, title: "桃園機場捷運沒有以下哪一站?", options: ["(A) 桃園體育園區", "(B) 華泰名品城", "(C) 體育大學"], ans: 1 },
        { id: 14, title: "師大桃友會沒有以下何種活動?", options: ["(A) 返鄉服務", "(B) 野餐例會", "(C) 啦啦"], ans: 2 },
        { id: 15, title: "桃園市與下列何者縣市不相連?", options: ["(A) 宜蘭縣", "(B) 苗栗縣", "(C) 新北市"], ans: 1 },
        { id: 16, title: "下列何者並非桃園在地文化特色?", options: ["(A) 高粱酒", "(B) 眷村", "(C) 客家文化"], ans: 0 },
        { id: 17, title: "下列何者並非桃園的觀光景點?", options: ["(A) 拉拉山", "(B) 小烏來", "(C) 猴硐貓村"], ans: 2 },
        { id: 18, title: "下列何者並非桃園所擁有的地形?", img: "highway.png",options: ["(A) 丘陵", "(B) 高原", "(C) 台地"], ans: 1 },
        { id: 19, title: "下列何者是居住在復興區主要的原住民族?", options: ["(A) 泰雅族", "(B) 阿美族", "(C) 賽德克族"], ans: 0 },
        { id: 20, title: "這座神社在哪?", img: "shrine.png", options: ["(A) 大阪", "(B) 桃園", "(C) 京都"], ans: 1 }
    ];

    // 初始化轉盤 UI (20等分)
    const segments = 20;
    const degPerSegment = 360 / segments;
    const wheel = document.getElementById('wheel');
    const wheelLabels = document.getElementById('wheel-labels');
    
    // 生成轉盤背景顏色與數字標籤
    const colors = ['#FFD1DC', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF'];
    let gradientParts = [];
    for(let i = 0; i < segments; i++) {
        let startDeg = i * degPerSegment;
        let endDeg = (i + 1) * degPerSegment;
        gradientParts.push(`${colors[i % colors.length]} ${startDeg}deg ${endDeg}deg`);
        
        let label = document.createElement('div');
        label.className = 'wheel-label';
        // 將標籤旋轉置中於每個扇形區塊
        label.style.transform = `rotate(${startDeg + degPerSegment/2}deg)`;
        label.innerText = i + 1;
        wheelLabels.appendChild(label);
    }
    wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`;

    let currentRotation = 0;
    let currentQuestion = null;

    // 轉盤邏輯
    function spinWheel() {
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        
        // 隨機旋轉圈數 (至少 5 圈) + 隨機角度
        const randomSpins = 5 + Math.random() * 5;
        const randomDeg = Math.floor(Math.random() * 360);
        currentRotation += (randomSpins * 360) + randomDeg;
        
        wheel.style.transform = `rotate(${currentRotation}deg)`;
        
        // 動畫結束後計算結果
        setTimeout(() => {
            btn.disabled = false;
            // 由於指針在 0 度（正上方），計算轉盤停下時正上方對應的扇形
            const normalizedDeg = (360 - (currentRotation % 360)) % 360;
            const winningIndex = Math.floor(normalizedDeg / degPerSegment);
            loadQuestion(winningIndex);
        }, 4000);
    }

    // 切換視圖工具
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    // 載入題目
    function loadQuestion(index) {
        currentQuestion = questions[index];
        document.getElementById('q-number').innerText = `第 ${currentQuestion.id} 題`;
        document.getElementById('q-title').innerText = currentQuestion.title;
        
        const imgEl = document.getElementById('q-img');
        if(currentQuestion.img) {
            imgEl.src = currentQuestion.img;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
            imgEl.src = '';
        }

        const optionsContainer = document.getElementById('q-options');
        optionsContainer.innerHTML = '';
        currentQuestion.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        switchView('view-question');
    }

    // 檢查答案
    function checkAnswer(selectedIndex) {
        const isCorrect = (selectedIndex === currentQuestion.ans);
        const icon = document.getElementById('r-icon');
        const title = document.getElementById('r-title');
        const desc = document.getElementById('r-desc');
        
        if(isCorrect) {
            icon.innerHTML = '✅';
            icon.className = 'feedback-icon correct';
            title.innerText = '答對了！';
            title.className = 'correct';
            desc.innerText = '太棒了，你完全掌握了桃園的知識！';
        } else {
            icon.innerHTML = '❌';
            icon.className = 'feedback-icon incorrect';
            title.innerText = '答錯了喔...';
            title.className = 'incorrect';
            const correctText = currentQuestion.options[currentQuestion.ans];
            desc.innerText = `正確答案應該是：\n${correctText}`;
        }
        
        switchView('view-result');
    }

    function goToWheel() {
        switchView('view-wheel');
    }
</script>
</body>
</html>
